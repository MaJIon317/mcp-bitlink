# Codex CLI / IDE / Desktop MCP config (project-scoped).
# Docs: https://learn.chatgpt.com/docs/extend/mcp
#
# 1. Export your merchant token:
#    export BITLINK_API_TOKEN="your-sanctum-token"
#
# 2. Set the MCP URL to your deployed HTTPS endpoint (or local):
#    export BITLINK_MCP_URL="https://mcp.example.com/mcp"
#
# 3. Restart Codex / run: codex mcp list
#
# Optional CLI install:
#   codex mcp add bitlink-invoices \
#     --url "$BITLINK_MCP_URL" \
#     --bearer-token-env-var BITLINK_API_TOKEN

[mcp_servers.bitlink-invoices]
url = "http://127.0.0.1:3500/mcp"
bearer_token_env_var = "BITLINK_API_TOKEN"
